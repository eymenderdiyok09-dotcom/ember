<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ember</title>
  <link rel="stylesheet" href="styles.css?v=1792078264" />
  <link rel="stylesheet" href="demo.css?v=1792078264" />
  <script src="main.js?v=1792078264" defer></script>
</head>
<body>
  <canvas class="backdrop" id="landscape" aria-hidden="true"></canvas>

  <header class="titlebar" data-tauri-drag-region>
    <div class="edition-switch" id="edition-switch" role="tablist" hidden>
      <button role="tab" data-edition="java" class="is-active">Java Edition</button>
      <button role="tab" data-edition="bedrock">Bedrock Edition</button>
    </div>
  </header>

  <main class="stage">
    <div class="brand">
      <div class="brand-row">
        <svg class="logo" id="logo" viewBox="0 0 12 14" aria-hidden="true"></svg>
        <h1>Ember</h1>
      </div>
      <p class="tagline">Minecraft, lit fast.</p>
    </div>

    <section class="panel" id="java-panel" aria-label="Java Edition">
      <div class="field">
        <div class="field-head">
          <label class="field-label" for="username">Player</label>
          <div class="mini-switch" id="account-mode" role="radiogroup" aria-label="Account type">
            <button role="radio" data-mode="offline" title="Play offline with any name">Offline</button>
            <button role="radio" data-mode="microsoft" title="Play online with your Minecraft account">Microsoft</button>
          </div>
        </div>
        <div class="input-wrap" id="offline-row">
          <canvas id="avatar" class="avatar" width="8" height="8" aria-hidden="true"></canvas>
          <input id="username" placeholder="Choose a username" maxlength="16" spellcheck="false" autocomplete="off" />
        </div>
        <button class="mc-button" id="ms-signin" hidden>
          <span class="mc-button-logo"><svg class="ms-mark" viewBox="0 0 20 20" aria-hidden="true"><rect width="9" height="9" fill="#f25022" /><rect x="11" width="9" height="9" fill="#7fba00" /><rect y="11" width="9" height="9" fill="#00a4ef" /><rect x="11" y="11" width="9" height="9" fill="#ffb900" /></svg></span>
          <span>Sign in with Microsoft</span>
        </button>
        <div class="input-wrap account-row" id="ms-row" hidden>
          <canvas id="ms-avatar" class="avatar" width="8" height="8" aria-hidden="true"></canvas>
          <span class="account-text">
            <span class="account-name" id="ms-name"></span>
            <span class="account-sub">Microsoft account · online play</span>
          </span>
          <button class="small-button" id="ms-signout">Sign out</button>
        </div>
      </div>

      <div class="field">
        <span class="field-label" id="version-label">Version</span>
        <div class="picker-wrap">
          <button class="picker" id="version-button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="version-label">
            <span class="picker-name" id="version-name">Loading…</span>
            <span class="badge" id="version-badge" hidden></span>
            <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" /></svg>
          </button>
          <div class="menu" id="version-menu" hidden>
            <input class="menu-search" id="version-search" placeholder="Search all versions" spellcheck="false" autocomplete="off" />
            <div class="menu-tabs" id="version-tabs"></div>
            <div class="menu-list" id="version-list" role="listbox"></div>
          </div>
        </div>
      </div>

      <div class="field">
        <div class="field-head">
          <label class="field-label" for="memory">Memory</label>
          <span class="field-value" id="memory-value"></span>
        </div>
        <input type="range" class="slider" id="memory" />
        <span class="field-hint" id="memory-hint"></span>
      </div>

      <label class="toggle-row">
        <span class="toggle-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M9.2 1.5 3.5 9h4l-1 5.5L12.5 7h-4z" /></svg></span>
        <span class="toggle-text">
          <span class="toggle-title">FPS Boost</span>
          <span class="toggle-sub">Sodium, Lithium &amp; more + tuned Java</span>
        </span>
        <input type="checkbox" class="switch" id="fps-boost" role="switch" />
      </label>

      <button class="play" id="java-play">
        <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" /></svg></span>
        <span class="play-text">
          <span class="play-label" id="java-play-label">Play</span>
          <span class="play-sub" id="java-play-sub"></span>
        </span>
      </button>
      <button class="cancel-link" id="java-cancel" hidden>Cancel</button>
    </section>

    <section class="panel" id="bedrock-panel" aria-label="Bedrock Edition" hidden>
      <div class="bedrock-status">
        <span class="dot" id="bedrock-dot"></span>
        <span id="bedrock-status">Checking installation…</span>
      </div>
      <button class="play" id="bedrock-play" disabled>
        <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" /></svg></span>
        <span class="play-text">
          <span class="play-label">Play</span>
          <span class="play-sub">Bedrock Edition</span>
        </span>
      </button>
    </section>
  </main>

  <footer class="footer">
    <span id="game-dir"></span>
  </footer>

  <div class="modal-backdrop" id="ms-modal" hidden>
    <div class="modal mc-modal" role="dialog" aria-modal="true" aria-labelledby="ms-title">
      <div class="mc-modal-head">
        <span class="mc-button-logo is-large"><svg class="ms-mark" viewBox="0 0 20 20" aria-hidden="true"><rect width="9" height="9" fill="#f25022" /><rect x="11" width="9" height="9" fill="#7fba00" /><rect y="11" width="9" height="9" fill="#00a4ef" /><rect x="11" y="11" width="9" height="9" fill="#ffb900" /></svg></span>
        <h2 id="ms-title">Microsoft Account</h2>
      </div>

      <div class="mc-modal-body" id="ms-step-code">
        <p class="modal-text">Go to the Microsoft sign-in page and enter this code:</p>
        <button class="device-code" id="ms-code" title="Click to copy"></button>
        <span class="device-code-hint">Click the code to copy it</span>
        <button class="mc-button" id="ms-open">
          <span class="mc-button-logo"><svg class="ms-mark" viewBox="0 0 20 20" aria-hidden="true"><rect width="9" height="9" fill="#f25022" /><rect x="11" width="9" height="9" fill="#7fba00" /><rect y="11" width="9" height="9" fill="#00a4ef" /><rect x="11" y="11" width="9" height="9" fill="#ffb900" /></svg></span>
          <span id="ms-open-label">Open microsoft.com/link</span>
        </button>
        <p class="modal-status"><span class="spinner" aria-hidden="true"></span>Waiting for you to finish signing in…</p>
      </div>

      <div class="mc-modal-body" id="ms-step-error" hidden>
        <p class="modal-text" id="ms-error"></p>
      </div>

      <button class="mc-button is-stone" id="ms-cancel">Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
