[package]
name = "mc-launcher"
version = "0.5.0"
description = "Ember — a lightweight Minecraft launcher"
license = "MIT"
repository = "https://github.com/eymenderdiyok09-dotcom/ember"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
ed25519-dalek = "2"
rsa = "0.9"
rand = "0.8"
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

# Size-focused release profile.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
